<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture title</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(() => {
  let theme, hidden;
  try {
    theme = localStorage.getItem("lecture-theme");
    hidden = localStorage.getItem("lecture-contents") === "hidden";
  } catch {}
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const narrow = matchMedia("(max-width: 960px)").matches;
  document.documentElement.classList.add(hidden || narrow ? "toc-floating" : "toc-docked");
})();

function lectureCanvas(canvas, draw) {
  const ctx = canvas.getContext("2d");
  const redraw = () => {
    const { width, height } = canvas.getBoundingClientRect();
    if (!width || !height) return;
    const ratio = window.devicePixelRatio || 1;
    const w = Math.round(width * ratio), h = Math.round(height * ratio);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    draw(ctx, width, height);
  };
  new ResizeObserver(redraw).observe(canvas);
  document.addEventListener("themechange", redraw);
  document.fonts?.addEventListener("loadingdone", redraw);
  return redraw;
}
</script>
<style>
/*
 * ground-up-lecture visual identity and page shell.
 *
 * Write the lecture into <main> after the header. Headings h2–h4 become the
 * contents panel automatically (ids are generated when missing), so do not
 * write a table of contents.
 *
 * Callouts:    <aside class="callout [definition|theorem|example|insight|warning|note]">
 *                <p class="callout-title">Definition 1.2</p> …
 *              </aside>
 * Checkpoints: <section class="checkpoint">
 *                <p class="checkpoint-title">Checkpoint 1.2</p> …
 *                [<details><summary>Hint</summary> …</details>]
 *                <details><summary>Solution</summary> …</details>
 *              </section>
 * Math:        KaTeX renders \( … \), \[ … \] and $$ … $$.
 * Figures:     <figure> … <figcaption>…</figcaption></figure>
 *              Interactive figures: <figure class="interactive">.
 * Figure UI:   <div class="controls"><label>Rate <input type="range"> <output>2</output></label> …</div>
 *              <div class="segmented" role="group"><button aria-pressed="true">A</button><button aria-pressed="false">B</button></div>
 *              <dl class="stats"><div><dt>Delivered</dt><dd>12</dd></div> …</dl>
 *              <ul class="legend"><li style="--swatch: var(--series-1)">Sent</li> …</ul>
 *              <div class="scroll">…</div> lets a wide diagram scroll instead of shrinking.
 *              Figure text renders at var(--figure-text) or larger; read it in canvas code.
 * Canvas:      const redraw = lectureCanvas(canvasEl, (ctx, width, height) => { … });
 *              draws in CSS pixels, stays sharp on high-density screens, and redraws
 *              on resize and theme change; call redraw() after state changes.
 *              Give the canvas a CSS height or width/height attributes for its ratio.
 * Theme:       light/dark follows the system or the reader's toggle. Use the tokens
 *              below in custom CSS and figures; the document fires "themechange".
 */

@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --bg: #ffffff;
  --surface: #f6f7f9;
  --surface-strong: #eef0f3;
  --text: #111418;
  --text-muted: #5b6370;
  --border: #e3e6ea;
  --border-strong: #c9ced6;

  --accent: #1d4ed8;
  --accent-bg: #eef4ff;
  --success: #15803d;
  --success-bg: #ecfdf3;
  --warning: #b45309;
  --warning-bg: #fff7e6;
  --violet: #6d28d9;
  --violet-bg: #f4f0ff;

  --series-1: #1d4ed8;
  --series-2: #e4572e;
  --series-3: #17a398;
  --series-4: #a23b72;
  --series-5: #f2a541;

  --radius: 8px;
  --figure-text: 13px;
  --measure: 72ch;
  --toc-width: 15.5rem;
  --toc-space: 0rem;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.06);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 24px rgb(0 0 0 / 0.1);
  color-scheme: light;
}

@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116;
    --surface: #161a21;
    --surface-strong: #1d222b;
    --text: #e6e9ee;
    --text-muted: #9aa3b0;
    --border: #262c36;
    --border-strong: #3a424f;
    --accent: #7aa2ff;
    --accent-bg: #16213a;
    --success: #4ade80;
    --success-bg: #11261a;
    --warning: #f5b454;
    --warning-bg: #2a1f0e;
    --violet: #b79cff;
    --violet-bg: #211a36;
    --series-1: #7aa2ff;
    --series-2: #ff8a65;
    --series-3: #4fd1c5;
    --series-4: #e879b9;
    --series-5: #f6c560;
    color-scheme: dark;
  }
}

@media screen {
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --surface: #161a21;
    --surface-strong: #1d222b;
    --text: #e6e9ee;
    --text-muted: #9aa3b0;
    --border: #262c36;
    --border-strong: #3a424f;
    --accent: #7aa2ff;
    --accent-bg: #16213a;
    --success: #4ade80;
    --success-bg: #11261a;
    --warning: #f5b454;
    --warning-bg: #2a1f0e;
    --violet: #b79cff;
    --violet-bg: #211a36;
    --series-1: #7aa2ff;
    --series-2: #ff8a65;
    --series-3: #4fd1c5;
    --series-4: #e879b9;
    --series-5: #f6c560;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 1.5rem; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.7;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}

/* Layout */

.page { padding: 3rem 1.5rem 6rem; }

main {
  width: min(var(--measure), 100% - var(--toc-space));
  margin-left: max(var(--toc-space), (100% - var(--measure)) / 2);
}

.toc-docked { --toc-space: calc(var(--toc-width) + 3rem); }

/* Contents: docked on the left, or floating when hidden or on narrow screens */

.toc {
  position: fixed;
  top: 3.75rem;
  bottom: 3.75rem;
  left: 1rem;
  z-index: 20;
  width: var(--toc-width);
  overflow-y: auto;
  overscroll-behavior: contain;
  font-size: 14px;
  line-height: 1.45;
  scrollbar-width: thin;
}
.toc-floating .toc {
  bottom: auto;
  max-height: calc(100vh - 7.5rem);
  width: min(var(--toc-width) + 2rem, 100vw - 2rem);
  padding: 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  opacity: 0;
  visibility: hidden;
  transform: translateX(-0.5rem);
  transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
}
.toc-floating .toc.peek { opacity: 1; visibility: visible; transform: none; }

.toc-edge { display: none; position: fixed; inset: 0 auto 0 0; width: 0.75rem; z-index: 19; }
.toc-floating:not(.toc-narrow) .toc-edge { display: block; }

.toc { --slot: 1.25rem; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc ol ol { margin-left: calc(var(--slot) / 2 - 0.5px); border-left: 1px solid var(--border); }
.toc li { margin: 0; }
.toc-row { display: flex; align-items: flex-start; }
.toc-row::before { content: ""; flex: 0 0 var(--slot); }
.toc li.has-children > .toc-row::before { display: none; }
.toc a {
  position: relative;
  flex: 1;
  display: block;
  padding: 0.28rem 0.5rem 0.28rem 0.15rem;
  color: var(--text-muted);
  text-decoration: none;
}
.toc a:hover { color: var(--text); }
.toc a.active { color: var(--accent); font-weight: 500; }
.toc ol ol a.active::before {
  content: "";
  position: absolute;
  left: calc(-1 * var(--slot) - 1.5px);
  top: 0.3rem;
  bottom: 0.3rem;
  width: 2px;
  border-radius: 2px;
  background: var(--accent);
}
.toc-fold {
  flex: 0 0 var(--slot);
  height: 1.8rem;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--text-muted);
}
.toc-fold svg { width: 0.8rem; height: 0.8rem; transition: transform 0.15s; }
.toc-fold[aria-expanded="true"] svg { transform: rotate(90deg); }
.toc-fold:hover { background: var(--surface); color: var(--text); }

/* Floating buttons and settings */

.float-button {
  position: fixed;
  left: 1rem;
  z-index: 22;
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  color: var(--text-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: var(--shadow-sm);
}
.float-button:hover { color: var(--text); background: var(--surface); }
.contents-button { top: 1rem; }
.settings-button { bottom: 1rem; }
.float-button[aria-expanded="true"] { color: var(--accent); }

.settings-panel {
  position: fixed;
  left: 1rem;
  bottom: 3.75rem;
  z-index: 22;
  width: 15rem;
  padding: 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.settings-label { margin: 0 0 0.5rem; font-size: 12px; font-weight: 500; color: var(--text-muted); }
.theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.25rem; padding: 0.2rem; background: var(--surface); border-radius: 8px; }
.theme-options button {
  display: grid;
  justify-items: center;
  gap: 0.2rem;
  padding: 0.4rem 0.25rem;
  font-size: 12px;
  color: var(--text-muted);
  background: none;
  border: 0;
  border-radius: 6px;
}
.theme-options button:hover { color: var(--text); background: none; }
.theme-options button[aria-checked="true"] { color: var(--text); background: var(--bg); box-shadow: var(--shadow-sm); }
.float-button svg, .theme-options svg, .toc-fold svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.float-button svg { width: 1.15rem; height: 1.15rem; }
.theme-options svg { width: 1.05rem; height: 1.05rem; }

@media (max-width: 960px) {
  .page { padding: 4.25rem 1rem 5rem; }
  main { width: auto; margin: 0; }
}

/* Typography */

h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.015em; font-weight: 600; margin: 2.5em 0 0.6em; }
h1 { font-size: 2.4rem; letter-spacing: -0.025em; font-weight: 700; margin-top: 0; }
h2 { font-size: 1.7rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
h3 { font-size: 1.3rem; }
h4 { font-size: 1.05rem; }
h1 + p, .subtitle { color: var(--text-muted); font-size: 1.15rem; }

p, ul, ol, table, figure, pre, blockquote { margin: 0 0 1.1rem; }
ul, ol { padding-left: 1.4rem; }
li { margin: 0.25rem 0; }
strong { font-weight: 600; }
dfn { font-style: normal; font-weight: 600; color: var(--accent); }

a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }

hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }

blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid var(--border-strong); color: var(--text-muted); }

mark { background: var(--warning-bg); color: inherit; padding: 0 0.15em; border-radius: 3px; }

code, kbd, samp { font-family: var(--font-mono); font-size: 0.86em; font-variant-ligatures: none; }
:not(pre) > code { background: var(--surface-strong); padding: 0.1em 0.35em; border-radius: 4px; }
kbd { padding: 0.05em 0.4em; background: var(--surface); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; font-size: 0.8em; white-space: nowrap; }
pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  overflow-x: auto;
  line-height: 1.55;
  font-size: 15px;
}
pre code { font-size: inherit; }

table { width: 100%; border-collapse: collapse; font-size: 15px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; border-bottom-color: var(--border-strong); }

.katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; margin: 0.5rem 0; }

/* Figures */

figure { margin: 1.75rem 0; }
figure > img, figure > svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
canvas { display: block; width: 100%; }
figcaption { margin-top: 0.6rem; font-size: 14px; color: var(--text-muted); }
figure.interactive { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; }

.scroll { overflow-x: auto; }
.scroll > svg, .scroll > canvas { min-width: 560px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.25rem; margin: 0.75rem 0; font-size: 14px; }
.controls label { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); }
output, .stats dd { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
output { min-width: 3ch; font-size: 14px; }

.segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.segmented button { border: 0; border-radius: 0; background: var(--bg); }
.segmented button + button { border-left: 1px solid var(--border-strong); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem; margin: 0.75rem 0; }
.stats > div { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.7rem; }
.stats dt { font-size: 12px; color: var(--text-muted); }
.stats dd { margin: 0; font-size: 16px; }

.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; list-style: none; padding: 0; margin: 0.6rem 0; font-size: 13px; color: var(--text-muted); }
.legend li { display: inline-flex; align-items: center; gap: 0.4rem; margin: 0; }
.legend li::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--swatch, var(--text-muted)); }

/* Controls */

button {
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 0.35rem 0.8rem;
  cursor: pointer;
}
button:hover { background: var(--surface-strong); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.primary:hover { filter: brightness(1.1); }
input, select, textarea {
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 0.35rem 0.6rem;
}
input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: none; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Callouts */

.callout {
  --c: var(--text-muted);
  --c-bg: var(--surface);
  margin: 1.5rem 0;
  padding: 0.9rem 1.1rem;
  background: var(--c-bg);
  border-radius: var(--radius);
}
.callout > :last-child { margin-bottom: 0; }
.callout-title { margin: 0 0 0.35rem; font-size: 14px; font-weight: 600; color: var(--c); letter-spacing: 0.01em; }
.callout.definition { --c: var(--accent); --c-bg: var(--accent-bg); }
.callout.theorem { --c: var(--violet); --c-bg: var(--violet-bg); }
.callout.example { --c: var(--text); --c-bg: var(--surface); }
.callout.insight { --c: var(--success); --c-bg: var(--success-bg); }
.callout.warning { --c: var(--warning); --c-bg: var(--warning-bg); }
.callout.note { --c: var(--text-muted); --c-bg: transparent; border: 1px solid var(--border); }

/* Checkpoints */

.checkpoint {
  margin: 2rem 0;
  padding: 1rem 1.15rem;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
}
.checkpoint > :last-child { margin-bottom: 0; }
.checkpoint-title { margin: 0 0 0.4rem; font-size: 14px; font-weight: 600; color: var(--accent); }
.checkpoint details { margin: 0.6rem 0 0; border-top: 1px solid var(--border); padding-top: 0.6rem; }
.checkpoint summary {
  cursor: pointer;
  width: fit-content;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  list-style: none;
}
.checkpoint summary::-webkit-details-marker { display: none; }
.checkpoint summary::before { content: "+ "; }
.checkpoint details[open] > summary::before { content: "− "; }
.checkpoint details[open] > summary { margin-bottom: 0.5rem; }
.checkpoint details > :last-child { margin-bottom: 0; }

/* Motion and print */

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media print {
  :root { --bg: #fff; --text: #000; }
  body { font-size: 11pt; }
  .page { display: block; padding: 0; max-width: none; }
  .toc, .float-button, .settings-panel, button, input, select { display: none; }
  main { width: auto; margin: 0; }
  h2 { break-before: page; border-top: 0; }
  .callout, .checkpoint, figure, pre { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="page">
<nav class="toc" id="toc" aria-label="Contents"></nav>
<main>
<header>
<h1>Lecture title</h1>
<p class="subtitle">Subtitle</p>
</header>

</main>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.documentElement;
  const main = document.querySelector("main");
  const nav = document.getElementById("toc");
  const store = {
    get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
    set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
  };
  const svg = (body) => `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
  const icons = {
    contents: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
    auto: svg('<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'),
    light: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
    dark: svg('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
    chevron: svg('<path d="m9 18 6-6-6-6"/>'),
    settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'),
  };
  const label = (el, text) => { el.title = text; el.setAttribute("aria-label", text); };


  // Theme
  const themes = { auto: "System", light: "Light", dark: "Dark" };
  let theme = store.get("lecture-theme") in themes ? store.get("lecture-theme") : "auto";
  const changed = () => document.dispatchEvent(new Event("themechange"));

  // Floating controls
  const contentsBtn = document.createElement("button");
  contentsBtn.type = "button";
  contentsBtn.className = "float-button contents-button";
  contentsBtn.setAttribute("aria-controls", "toc");
  contentsBtn.innerHTML = icons.contents;
  const settingsBtn = document.createElement("button");
  settingsBtn.type = "button";
  settingsBtn.className = "float-button settings-button";
  settingsBtn.setAttribute("aria-controls", "settings");
  settingsBtn.setAttribute("aria-expanded", "false");
  settingsBtn.innerHTML = icons.settings;
  label(settingsBtn, "Settings");
  const settings = document.createElement("div");
  settings.className = "settings-panel";
  settings.id = "settings";
  settings.hidden = true;
  settings.innerHTML =
    '<p class="settings-label" id="theme-label">Theme</p>' +
    '<div class="theme-options" role="radiogroup" aria-labelledby="theme-label">' +
    Object.entries(themes).map(([key, name]) =>
      `<button type="button" role="radio" data-theme-option="${key}">${icons[key]}${name}</button>`).join("") +
    "</div>";
  const edge = document.createElement("div");
  edge.className = "toc-edge";
  document.body.append(contentsBtn, settingsBtn, settings, edge);

  const applyTheme = () => {
    if (theme === "auto") delete root.dataset.theme;
    else root.dataset.theme = theme;
    settings.querySelectorAll("[data-theme-option]").forEach((b) =>
      b.setAttribute("aria-checked", b.dataset.themeOption === theme));
  };
  settings.addEventListener("click", (e) => {
    const option = e.target.closest("[data-theme-option]");
    if (!option || option.dataset.themeOption === theme) return;
    theme = option.dataset.themeOption;
    store.set("lecture-theme", theme);
    applyTheme();
    changed();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => theme === "auto" && changed());
  // Print in light colors: canvases redraw from the light tokens, then restore
  addEventListener("beforeprint", () => { root.dataset.theme = "light"; changed(); });
  addEventListener("afterprint", () => { applyTheme(); changed(); });
  applyTheme();

  const setSettings = (open) => {
    settings.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", open);
  };
  settingsBtn.onclick = () => setSettings(settings.hidden);

  // Contents visibility: docked on wide screens unless hidden; otherwise a floating panel
  const narrow = matchMedia("(max-width: 960px)");
  let hidden = store.get("lecture-contents") === "hidden";
  let peekTimer;
  let suppressHover = false;
  const floating = () => hidden || narrow.matches;
  const applyContents = () => {
    root.classList.toggle("toc-floating", floating());
    root.classList.toggle("toc-docked", !floating());
    root.classList.toggle("toc-narrow", narrow.matches);
    const shown = !floating() || nav.classList.contains("peek");
    contentsBtn.setAttribute("aria-expanded", shown);
    label(contentsBtn, narrow.matches
      ? (shown ? "Close contents" : "Open contents")
      : (hidden ? "Pin contents" : "Hide contents"));
  };
  const peek = (on) => {
    clearTimeout(peekTimer);
    nav.classList.toggle("peek", on);
    applyContents();
  };
  for (const el of [contentsBtn, edge, nav]) {
    el.addEventListener("pointerenter", (e) => {
      if (e.pointerType !== "mouse" || !hidden || narrow.matches || suppressHover) return;
      peek(true);
    });
    el.addEventListener("pointerleave", (e) => {
      if (el === contentsBtn) suppressHover = false;
      if (e.pointerType !== "mouse" || !hidden || narrow.matches) return;
      clearTimeout(peekTimer);
      peekTimer = setTimeout(() => peek(false), 250);
    });
  }
  contentsBtn.onclick = () => {
    if (narrow.matches) return peek(!nav.classList.contains("peek"));
    hidden = !hidden;
    store.set("lecture-contents", hidden ? "hidden" : "shown");
    suppressHover = hidden && contentsBtn.matches(":hover");
    peek(false);
  };
  nav.addEventListener("click", (e) => floating() && e.target.closest("a") && peek(false));
  document.addEventListener("click", (e) => {
    if (!settings.hidden && !settings.contains(e.target) && !settingsBtn.contains(e.target)) setSettings(false);
    if (narrow.matches && nav.classList.contains("peek") && !nav.contains(e.target) && !contentsBtn.contains(e.target)) peek(false);
  });
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    setSettings(false);
    if (floating()) peek(false);
  });
  narrow.addEventListener("change", () => peek(false));
  applyContents();

  // Contents, generated from every h2–h4 in the lecture
  const slug = (s) =>
    s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
      .replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "section";
  const used = new Set([...document.querySelectorAll("[id]")].map((e) => e.id));
  const heads = [...main.querySelectorAll("h2, h3, h4")]
    .filter((h) => !h.closest("figure, aside, .checkpoint, details"));

  const setOpen = (li, open) => {
    li.querySelector(":scope > ol").hidden = !open;
    li.querySelector(":scope > .toc-row > .toc-fold").setAttribute("aria-expanded", open);
  };
  const addFold = (li) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "toc-fold";
    b.innerHTML = icons.chevron;
    label(b, "Toggle subsections");
    b.onclick = () => setOpen(li, b.getAttribute("aria-expanded") !== "true");
    li.classList.add("has-children");
    li.firstChild.prepend(b);
  };

  const top = document.createElement("ol");
  const stack = [{ level: 1, list: top }];
  const items = [];
  for (const h of heads) {
    if (!h.id) {
      const base = slug(h.textContent);
      let id = base;
      for (let n = 2; used.has(id); n++) id = `${base}-${n}`;
      h.id = id;
      used.add(id);
    }
    const level = +h.tagName[1];
    while (stack.at(-1).level >= level) stack.pop();
    const parent = stack.at(-1);
    if (!parent.list) {
      parent.list = document.createElement("ol");
      parent.li.append(parent.list);
      addFold(parent.li);
    }
    const li = document.createElement("li");
    const row = document.createElement("div");
    row.className = "toc-row";
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.append(...[...h.childNodes].map((n) => n.cloneNode(true)));
    a.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
    row.append(a);
    li.append(row);
    parent.list.append(li);
    stack.push({ level, li, list: null });
    items.push({ h, a, li });
  }
  nav.append(top);
  nav.querySelectorAll("li.has-children").forEach((li) => setOpen(li, false));

  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  }

  // Current section: highlight it and unfold it with its ancestors; never fold anything
  let active = null;
  const update = () => {
    const end = innerHeight + scrollY >= root.scrollHeight - 2;
    let cur = items[0];
    for (const it of items) {
      if (it.h.getBoundingClientRect().top > (end ? innerHeight : 120)) break;
      cur = it;
    }
    if (!cur || cur === active) return;
    active?.a.classList.remove("active");
    active?.a.removeAttribute("aria-current");
    active = cur;
    cur.a.classList.add("active");
    cur.a.setAttribute("aria-current", "true");
    for (let li = cur.li; li; li = li.parentElement.closest("li")) li.classList.contains("has-children") && setOpen(li, true);
    const y = cur.a.offsetTop;
    if (y < nav.scrollTop || y > nav.scrollTop + nav.clientHeight - 40)
      nav.scrollTop = y - nav.clientHeight / 3;
  };
  let queued = false;
  addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }, { passive: true });
  update();
});
</script>
</body>
</html>
